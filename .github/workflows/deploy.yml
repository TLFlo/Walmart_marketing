name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main-clean ] # Déclenche l'action lors d'un push sur main-clean

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Ne récupère que les 2 derniers commits légers

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://FloridaTOVANA:$HF_TOKEN@huggingface.co/spaces/FloridaTOVANA/wallmart-v2 main-clean:main